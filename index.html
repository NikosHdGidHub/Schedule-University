<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание ВУЗ</title>
    <style>
        /* ===== Все стили (без изменений) ===== */
        :root {
            --bg-page: #f4f7fb;
            --bg-card: #ffffff;
            --bg-header: #f8fafc;
            --bg-today: #f8faff;
            --bg-current-lesson: #ecfdf5;
            --bg-next-lesson: #ffffff;
            --bg-empty-slot: #f8fafc;
            --bg-holiday: #fef9c3;
            --bg-badge: #e2e8f0;
            --bg-badge-today: #bfdbfe;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e2e8f0;
            --bg-btn-active: #1e293b;
            --bg-countdown: #eff6ff;
            --bg-countdown-urgent: #fee2e2;
            --bg-current-time: #d1fae5;
            --bg-modal: rgba(0,0,0,0.4);
            --bg-modal-content: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-heading: #0f172a;
            --text-badge: #475569;
            --text-badge-today: #1e40af;
            --text-btn: #334155;
            --text-btn-active: #ffffff;
            --text-countdown: #3b82f6;
            --text-countdown-urgent: #dc2626;
            --text-current-label: #065f46;
            --text-current-time: #059669;
            --text-holiday: #1e293b;
            --text-empty: #94a3b8;
            --border-card: #94a3b8;
            --border-today: #3b82f6;
            --border-light: #e9edf2;
            --border-current: #10b981;
            --border-current-item: #d1fae5;
            --border-lesson: #f1f5f9;
            --border-btn: #cbd5e1;
            --border-btn-active: #1e293b;
            --border-modal: #cbd5e1;
            --shadow-card: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-today: 0 4px 16px rgba(59, 130, 246, 0.15);
            --shadow-next: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-current: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-modal: 0 20px 60px rgba(0,0,0,0.3);
        }
        body.dark-theme {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #2d3748;
            --bg-today: #1e2a3a;
            --bg-current-lesson: #1a2a2f;
            --bg-next-lesson: #1e293b;
            --bg-empty-slot: #2d3748;
            --bg-holiday: #422b2b;
            --bg-badge: #334155;
            --bg-badge-today: #1e3a5f;
            --bg-btn: #1e293b;
            --bg-btn-hover: #334155;
            --bg-btn-active: #3b82f6;
            --bg-countdown: #1e3a5f;
            --bg-countdown-urgent: #4c1d1d;
            --bg-current-time: #1a3a34;
            --bg-modal: rgba(0,0,0,0.7);
            --bg-modal-content: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-heading: #f1f5f9;
            --text-badge: #cbd5e1;
            --text-badge-today: #93c5fd;
            --text-btn: #cbd5e1;
            --text-btn-active: #ffffff;
            --text-countdown: #60a5fa;
            --text-countdown-urgent: #f87171;
            --text-current-label: #6ee7b7;
            --text-current-time: #6ee7b7;
            --text-holiday: #fcd34d;
            --text-empty: #64748b;
            --border-card: #475569;
            --border-today: #60a5fa;
            --border-light: #334155;
            --border-current: #34d399;
            --border-current-item: #1a3a34;
            --border-lesson: #334155;
            --border-btn: #475569;
            --border-btn-active: #3b82f6;
            --border-modal: #475569;
            --shadow-card: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-today: 0 4px 16px rgba(96, 165, 250, 0.25);
            --shadow-next: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-current: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-modal: 0 20px 60px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg-page);
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }
        h1 { text-align: center; font-weight: 600; font-size: 1.8rem; margin-bottom: 16px; color: var(--text-heading); letter-spacing: -0.5px; transition: color 0.3s; }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header-container h1 { margin: 0; flex: 1; text-align: center; }
        .theme-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-btn);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            color: var(--text-btn);
        }
        .theme-btn:hover { background: var(--bg-btn-hover); }
        .tab-switcher {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .tab-btn {
            padding: 10px 28px;
            border: 2px solid var(--border-btn);
            background: var(--bg-card);
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-btn);
        }
        .tab-btn:hover { background: var(--bg-btn-hover); }
        .tab-btn.active {
            background: var(--bg-btn-active);
            border-color: var(--border-btn-active);
            color: var(--text-btn-active);
        }
        .tab-btn.active:hover { background: var(--bg-btn-active); }
        .week-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .week-nav-btn {
            padding: 8px 20px;
            border: 2px solid var(--border-btn);
            background: var(--bg-card);
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-btn);
        }
        .week-nav-btn:hover { background: var(--bg-btn-hover); }
        .week-info {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-heading);
            min-width: 160px;
            text-align: center;
        }
        .week-info .week-number { font-size: 1.3rem; }
        .week-info .week-parity {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-left: 6px;
        }
        .today-filter { margin-left: 8px; }
        .tab-btn.active.today-filter {
            background: var(--bg-btn-active);
            border-color: var(--border-btn-active);
            color: var(--text-btn-active);
        }
        .current-lesson-block {
            background: var(--bg-current-lesson);
            border-radius: 20px;
            box-shadow: var(--shadow-current);
            padding: 20px 24px;
            margin-bottom: 16px;
            border-left: 6px solid var(--border-current);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .current-lesson-block .current-lesson-label {
            font-weight: 700;
            color: var(--text-current-label);
            font-size: 1.1rem;
            margin-bottom: 10px;
            transition: color 0.3s;
        }
        .current-lesson-item {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 20px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-current-item);
            transition: border-color 0.3s;
        }
        .current-lesson-item:last-child { border-bottom: none; }
        .current-lesson-item .lesson-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-heading);
            transition: color 0.3s;
        }
        .current-lesson-item .lesson-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: color 0.3s;
        }
        .current-lesson-item .time-left {
            font-weight: 600;
            color: var(--text-current-time);
            background: var(--bg-current-time);
            padding: 2px 12px;
            border-radius: 30px;
            transition: background 0.3s, color 0.3s;
        }
        .next-lesson-block {
            background: var(--bg-next-lesson);
            border-radius: 20px;
            box-shadow: var(--shadow-next);
            padding: 20px 24px;
            margin-bottom: 28px;
            border-left: 6px solid var(--border-today);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .next-lesson-block .label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            transition: color 0.3s;
        }
        .next-lesson-block .main-info {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 12px 20px;
        }
        .next-lesson-block .lesson-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-heading);
            transition: color 0.3s;
        }
        .next-lesson-block .lesson-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            transition: color 0.3s;
        }
        .next-lesson-block .lesson-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .next-lesson-block .countdown {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-countdown);
            background: var(--bg-countdown);
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            transition: background 0.3s, color 0.3s;
        }
        .next-lesson-block .countdown.urgent {
            color: var(--text-countdown-urgent);
            background: var(--bg-countdown-urgent);
        }
        .next-lesson-block .no-lessons {
            font-size: 1.1rem;
            color: var(--text-muted);
            transition: color 0.3s;
        }
        .holiday-message {
            padding: 30px 20px;
            text-align: center;
            font-size: 1.3rem;
            color: var(--text-holiday);
            background: var(--bg-holiday);
            border-radius: 12px;
            margin: 12px 20px;
            transition: background 0.3s, color 0.3s;
        }
        .holiday-message .holiday-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .holiday-message .holiday-text { font-weight: 600; }
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .day-card {
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            border-left: 6px solid var(--border-card);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .day-card.today {
            border-left-color: var(--border-today);
            background: var(--bg-today);
            box-shadow: var(--shadow-today);
        }
        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-light);
            font-weight: 600;
            font-size: 1.1rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .day-header .date-badge {
            background: var(--bg-badge);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-badge);
            transition: background 0.3s, color 0.3s;
        }
        .day-card.today .day-header {
            background: var(--bg-today);
        }
        .day-card.today .date-badge {
            background: var(--bg-badge-today);
            color: var(--text-badge-today);
        }
        .lesson-list { padding: 8px 0; }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-lesson);
            transition: background 0.3s, border-color 0.3s;
        }
        .lesson-item:last-child { border-bottom: none; }
        .lesson-item.current {
            background: var(--bg-current-lesson);
            border-left: 4px solid var(--border-current);
        }
        .lesson-item.empty-slot {
            background: var(--bg-empty-slot);
            opacity: 0.7;
            border-left: 3px solid var(--border-card);
        }
        .lesson-item.empty-slot .lesson-name {
            color: var(--text-empty);
            font-style: italic;
        }
        .lesson-time {
            font-weight: 500;
            color: var(--text-primary);
            min-width: 90px;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .lesson-info { flex: 1; }
        .lesson-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            transition: color 0.3s;
        }
        .lesson-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 2px;
            transition: color 0.3s;
        }
        .lesson-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .lesson-meta .icon { font-size: 0.9rem; }
        .lesson-add-hw {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 2px 8px;
            border-radius: 30px;
            transition: 0.2s;
            margin-left: 8px;
        }
        .lesson-add-hw:hover {
            background: var(--bg-btn-hover);
            color: var(--text-btn);
        }
        .no-lessons {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            transition: color 0.3s;
        }
        #homeworksContainer {
            display: none;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            padding: 20px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        #homeworksContainer.active { display: block; }
        .hw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .hw-header h2 {
            font-size: 1.4rem;
            color: var(--text-heading);
        }
        .hw-actions {
            display: flex;
            gap: 10px;
        }
        .hw-actions button {
            padding: 6px 14px;
            border: 2px solid var(--border-btn);
            border-radius: 30px;
            background: var(--bg-card);
            color: var(--text-btn);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .hw-actions button:hover { background: var(--bg-btn-hover); }
        .hw-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .hw-day-group {
            background: var(--bg-header);
            border-radius: 12px;
            padding: 12px 16px;
            transition: background 0.3s;
        }
        .hw-day-title {
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .hw-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
            transition: border-color 0.3s;
        }
        .hw-item:last-child { border-bottom: none; }
        .hw-item .hw-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--border-today);
        }
        .hw-item .hw-info { flex: 1; }
        .hw-item .hw-subject {
            font-weight: 600;
            color: var(--text-primary);
        }
        .hw-item .hw-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .hw-item .hw-deadline {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .hw-item .hw-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .hw-item .hw-delete:hover {
            background: var(--bg-countdown-urgent);
            color: var(--text-countdown-urgent);
        }
        .hw-empty {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-modal);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-modal-content);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-modal);
            position: relative;
            transition: background 0.3s;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 20px;
        }
        .modal-form label {
            display: block;
            font-weight: 600;
            margin: 12px 0 4px;
            color: var(--text-secondary);
        }
        .modal-form input, .modal-form textarea, .modal-form select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-btn);
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .modal-form input:focus, .modal-form textarea:focus, .modal-form select:focus {
            outline: none;
            border-color: var(--border-today);
        }
        .modal-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-form .submit-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--bg-btn-active);
            color: var(--text-btn-active);
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .modal-form .submit-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        @media (max-width: 500px) {
            .lesson-item { flex-wrap: wrap; gap: 6px; }
            .lesson-time { min-width: 70px; font-size: 0.85rem; }
            .day-header { font-size: 1rem; padding: 10px 16px; }
            .tab-btn { padding: 8px 20px; font-size: 0.9rem; }
            .theme-btn { font-size: 1rem; padding: 6px 12px; }
            .modal-content { padding: 20px; }
            .week-nav-btn { padding: 6px 16px; font-size: 0.9rem; }
            .week-info { min-width: 120px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>📚 Расписание</h1>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </div>

    <!-- Вкладки -->
    <div class="tab-switcher" id="mainTabs">
        <button class="tab-btn active" data-tab="schedule">📅 Расписание</button>
        <button class="tab-btn" data-tab="homeworks">📋 Домашние задания</button>
    </div>

    <!-- Навигация по неделям -->
    <div class="week-navigation">
        <button class="week-nav-btn" id="prevWeekBtn">◀ Пред.</button>
        <span class="week-info" id="weekInfo">
            <span class="week-number" id="weekNumberDisplay">Неделя 1</span>
            <span class="week-parity" id="weekParityDisplay">(чётная)</span>
        </span>
        <button class="week-nav-btn" id="nextWeekBtn">След. ▶</button>
        <button id="todayFilterBtn" class="tab-btn today-filter">📅 Сегодня</button>
    </div>

    <!-- Блоки текущей и следующей пары -->
    <div id="currentLessonBlock" class="current-lesson-block" style="display: none;">
        <div id="currentLessonContent"></div>
    </div>
    <div id="nextLessonBlock" class="next-lesson-block">
        <div class="label">⏳ Следующая пара</div>
        <div id="nextLessonContent"></div>
    </div>

    <!-- Расписание -->
    <div id="scheduleContainer" class="schedule-grid"></div>

    <!-- Домашние задания -->
    <div id="homeworksContainer" >
        <div class="hw-header">
            <h2>📋 Домашние задания</h2>
            <div class="hw-actions">
                <button id="exportHwBtn">⬇️ Экспорт</button>
                <button id="importHwBtn">⬆️ Импорт</button>
            </div>
        </div>
        <div id="hwList" class="hw-list"></div>
    </div>

    <!-- Модалка ДЗ -->
    <div id="hwModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="hwModalClose">&times;</button>
            <div class="modal-title" id="hwModalTitle">➕ Добавить задание</div>
            <form id="hwForm" class="modal-form">
                <input type="hidden" id="hwEditId" value="">
                <label for="hwDay">День недели</label>
                <select id="hwDay" required>
                    <option value="1">Понедельник</option>
